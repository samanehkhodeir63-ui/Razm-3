ild(3){ animation-delay:.4s; } @keyframes bounce{ 0%,100%{ transform:translateY(0); opacity:.3; } 50%{ transform:translateY(-14px); opacity:1; } } </style> </head> <body> <div class="box"> <div class="logo">Razm</div> <div class="title"> Razm در حال بروزرسانی است </div> <div class="text"> لطفاً تا ۱ ساعت دیگر وارد شو. <br> نسخه جدید رزم در حال آماده‌سازی است... </div> <div class="loading"> <span></span> <span></span> <span></span> </div> </div> </body> </html>
